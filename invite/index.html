<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>招待されました ｜ 柴ライフ ShibaLife</title>
<meta name="description" content="柴ライフ（ShibaLife）への招待。友だちコードを入れると、おたがいにホネがもらえます。">
<meta name="robots" content="noindex">
<meta property="og:title" content="柴ライフで、いっしょにお散歩しよう">
<meta property="og:description" content="赤柴のトシコと暮らす、やさしいお散歩ゲーム。友だちコードでホネ300個プレゼント。">
<meta property="og:image" content="https://shibalife.jp/img/og.jpg">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .invite { max-width: 520px; margin: 0 auto; padding: 32px 20px 48px; text-align: center; }
  .invite img.hero { width: 180px; height: auto; }
  .code { font: 800 32px/1.2 ui-monospace, Menlo, monospace; color: #e86a8a; background: #fff; border: 2px dashed #f2a7b8;
          border-radius: 16px; padding: 14px 18px; margin: 18px auto; display: inline-block; letter-spacing: 1px; user-select: all; }
  .steps { text-align: left; margin: 20px auto; max-width: 420px; line-height: 1.8; }
  .en { color: #7a6a66; font-size: 15px; margin-top: 28px; }
</style>
</head>
<body>
<main class="invite">
  <img class="hero" src="/img/toshiko.png" alt="柴犬のトシコ">
  <h1>柴ライフに招待されました</h1>
  <p>赤柴のトシコと暮らす、やさしいお散歩ゲーム。</p>
  <div id="withcode" hidden>
    <p>友だちコード</p>
    <div class="code" id="code"></div>
    <ol class="steps">
      <li>App Storeから「柴ライフ」をダウンロード</li>
      <li>設定 → 友だち で、サインインしてこのコードを入力</li>
      <li>ふたりとも ホネ300個 プレゼント！</li>
    </ol>
  </div>
  <p><a class="btn" href="https://apps.apple.com/app/id6815152223">App Storeで見る</a></p>
  <p class="en" lang="en">You've been invited to ShibaLife. Get the app, then enter your friend's code in Settings → Friends, and you both get 300 Bones.</p>
</main>
<script>
  const c = new URLSearchParams(location.search).get('c');
  if (c && /^TOMO-[0-9A-Z]{6}$/.test(c)) {
    document.getElementById('code').textContent = c;
    document.getElementById('withcode').hidden = false;
  }
</script>
</body>
</html>
